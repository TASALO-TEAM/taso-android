name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Tests unitarios + APK debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: taso-android-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reportes de tests (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: APK release firmado (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tasalo.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/tasalo.jks"
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "taso-android-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "taso-android-${GITHUB_REF_NAME}.apk" \
            --title "TASALO Android ${GITHUB_REF_NAME}" --generate-notes