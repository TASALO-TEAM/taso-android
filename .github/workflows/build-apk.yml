name: Build APK

# Cada push a main compila y prueba. Si VERSION_NAME (gradle.properties) es una versión
# que aún no tiene Release, se firma el APK y se publica: la app avisará a los usuarios.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Versión y estado de la Release
        id: ver
        run: |
          V=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint (APIs que no existen en Android 8-12)
        run: ./gradlew lintDebug --stacktrace

      - name: Tests unitarios + APK debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: taso-android-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reportes de tests (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publicar Release firmada (versión nueva en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.released == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tasalo.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/tasalo.jks"
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "taso-android-v$V.apk"
          # Notas de la Release = sección "## <versión>" de CHANGELOG.md (Markdown; la app las muestra).
          awk -v h="## $V" 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "TASALO Android $V" > notes.md
          # Huella del APK (la app la verifica antes de instalar) y del certificado de firma (se muestra en Ajustes).
          sha256sum "taso-android-v$V.apk" > "taso-android-v$V.apk.sha256"
          FP=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 "SHA256:" | sed "s/.*SHA256: *//")
          printf "\n\n---\n**Huella SHA-256 del certificado de firma:**\n`%s`\n" "$FP" >> notes.md
          gh release create "v$V" "taso-android-v$V.apk" "taso-android-v$V.apk.sha256" \
            --target "$GITHUB_SHA" --title "TASALO Android v$V" --notes-file notes.md